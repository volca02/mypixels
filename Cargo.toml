[package]
name = "mypixels"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26.0"
glyphon = "0.12.0"
wgpu = "30"
winit = "0.30"
portable-pty = "0.9"
serde_yaml = "0.9"
dirs = "6"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
arc-swap = "1"
# The crate cosmic-text's `Fallback` trait signature uses; cargo unifies it so
# we implement the very same trait cosmic-text calls.
unicode-script = "0.5"
libc = "0.2"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.12", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = "0.37"
png = "0.17"
zbus = "5"
futures = "0.3.34"

[profile.release]
# Terminal emulator: throughput matters, and the default release profile leaves
# real gains on the table. Thin LTO across crates without fat-LTO build times.
codegen-units = 1
lto = "thin"
# Line tables kept so `perf record` on this binary says what it actually
# ran (egui layout vs glyphon vs wgpu). Costs disk, not speed; set back to
# strip = true / drop debug when not profiling.
debug = 1
strip = false

# --- patched dependency -------------------------------------------------------
# Local changes: mutable completed line layouts for terminal cell placement,
# and one extra entry in the raster source list of vendor/cosmic-text/src/swash.rs: swash's `Source::Bitmap`, which makes a
# font's embedded alpha bitmap strikes (EBLC/EBDT) usable. Upstream omits it, so
# a bitmap terminal font such as Terminus is drawn as an unhinted outline and
# looks blurry. The vendored copy is trimmed of tests/docs otherwise.
[patch.crates-io]
cosmic-text = { path = "vendor/cosmic-text" }
